# AlexNet architecture for Tiny-ImageNet-200 (64x64 RGB, 200 classes)
# laid out for a SINGLE GPU.
#
# The 2012 ImageNet definition (layers/layers-120.cfg) is a two-column,
# two-GPU network over 224x224 crops: every stage is split into an "a"/"b" half
# on gpu=0/gpu=1 that only exchange data at conv3 and the first FC layer.
#
# This file keeps the AlexNet topology -- 5 convolutions with ReLU, max pooling,
# cross-map response normalisation after conv1/conv2, three fully connected
# layers with dropout on the last two -- but:
#
#   * runs as one column on gpu=0, so no cross-GPU copies are needed;
#   * adapts the spatial dimensions to 64x64 input;
#   * widens conv1 to 64 filters (the 2012 net's 32+32 split across two GPUs).
#
# Feature map sizes: 64 -> conv1 64 -> pool1 32 -> conv2 32 -> pool2 16 ->
# conv3 16 -> conv4 16 -> conv5 16 -> pool3 8.  fc6 therefore sees 128*8*8.

[data]
type=data
dataIdx=0

[labels]
type=data
dataIdx=1

[conv1]
type=conv
inputs=data
channels=3
filters=64
padding=2
stride=1
filterSize=5
initW=0.01
initB=1
partialSum=1
sharedBiases=1
neuron=relu
gpu=0

[pool1]
type=pool
pool=max
inputs=conv1
sizeX=3
stride=2
channels=64

[rnorm1]
type=cmrnorm
inputs=pool1
channels=64
size=5

[conv2]
type=conv
inputs=rnorm1
channels=64
filters=128
padding=2
stride=1
filterSize=5
initW=0.01
initB=1
partialSum=1
sharedBiases=1
neuron=relu
gpu=0

[pool2]
type=pool
pool=max
inputs=conv2
sizeX=3
stride=2
channels=128

[rnorm2]
type=cmrnorm
inputs=pool2
channels=128
size=5

[conv3]
type=conv
inputs=rnorm2
channels=128
filters=256
padding=1
stride=1
filterSize=3
initW=0.01
initB=1
partialSum=1
sharedBiases=1
neuron=relu
gpu=0

[conv4]
type=conv
inputs=conv3
channels=256
filters=256
padding=1
stride=1
filterSize=3
initW=0.01
initB=1
partialSum=1
sharedBiases=1
neuron=relu
gpu=0

[conv5]
type=conv
inputs=conv4
channels=256
filters=128
padding=1
stride=1
filterSize=3
initW=0.01
initB=1
partialSum=1
sharedBiases=1
neuron=relu
gpu=0

[pool3]
type=pool
pool=max
inputs=conv5
sizeX=3
stride=2
channels=128

[fc6]
type=fc
inputs=pool3
outputs=4096
initW=0.005
initB=1
neuron=relu
gpu=0

[drop6]
type=hs
inputs=fc6
keep=0.5

[fc7]
type=fc
inputs=drop6
outputs=4096
initW=0.005
initB=1
neuron=relu
gpu=0

[drop7]
type=hs
inputs=fc7
keep=0.5

[fc8]
type=fc
inputs=drop7
outputs=200
initW=0.01
gpu=0

[probs]
type=softmax
inputs=fc8

[logprob]
type=cost.logreg
inputs=labels,probs
gpu=0
