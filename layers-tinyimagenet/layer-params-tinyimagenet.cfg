# Learning-rate / regularisation parameters for layers-tinyimagenet.cfg.
#
# Mirrors the 2012 ImageNet settings: momentum 0.9, weight decay 5e-4 on the
# weights, per-layer epsilon on weights and biases.  The epsilons are the
# "epsW" schedule from layers/layer-params-120-2012.cfg (large early, decayed
# by hand as training progresses); kept constant here because this run trains
# for far fewer epochs.

[conv1]
epsW=0.0001
epsB=0.0002
momW=0.9
momB=0.9
wc=0.0005

[conv2]
epsW=0.0001
epsB=0.0002
momW=0.9
momB=0.9
wc=0.0005

[conv3]
epsW=0.0001
epsB=0.0002
momW=0.9
momB=0.9
wc=0.0005

[conv4]
epsW=0.0001
epsB=0.0002
momW=0.9
momB=0.9
wc=0.0005

[conv5]
epsW=0.0001
epsB=0.0002
momW=0.9
momB=0.9
wc=0.0005

[fc6]
epsW=0.0001
epsB=0.0002
momW=0.9
momB=0.9
wc=0.0005

[fc7]
epsW=0.0001
epsB=0.0002
momW=0.9
momB=0.9
wc=0.0005

[fc8]
epsW=0.0001
epsB=0.0002
momW=0.9
momB=0.9
wc=0.0005

[drop6]
enable=true

[drop7]
enable=true

[rnorm1]
scale=0.0001
pow=0.75
minDiv=1

[rnorm2]
scale=0.0001
pow=0.75
minDiv=1

[logprob]
coeff=1
topk=5
